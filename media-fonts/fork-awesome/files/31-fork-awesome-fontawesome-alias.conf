<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!--
	  Fork Awesome is a drop-in replacement for Font Awesome 4.x, whose
	  family name is "FontAwesome" (Waybar's default style.css, among
	  others, asks for it).  Accept "forkawesome" whenever "FontAwesome"
	  is requested; a real Font Awesome 4 still wins if it is installed.
	  Enable with: eselect fontconfig enable 31-fork-awesome-fontawesome-alias.conf
	-->
	<alias binding="same">
		<family>FontAwesome</family>
		<accept>
			<family>forkawesome</family>
		</accept>
	</alias>
</fontconfig>
